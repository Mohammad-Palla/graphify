[package]
name = "graphify-kernel"
version = "0.1.0"
edition = "2021"
description = "Native per-file AST extraction core for Graphify"
license = "MIT"

[lib]
name = "graphify_kernel"
crate-type = ["cdylib"]

[dependencies]
# abi3-py310: one wheel for every CPython >= 3.10, matching Graphify's floor.
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module"] }
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
# Must match the Python side (tree-sitter-python 0.25.0, ABI 15, 274 kinds,
# 32 fields). `languages::grammar_fingerprints` enforces it at load time --
# see that function for the JS 0.23-vs-0.25 skew that motivated the check.
tree-sitter-python = "0.25"
# Each of these was verified to produce the SAME (abi, node_kind_count,
# field_count) as the installed Python package before being added -- see
# `languages::grammar_fingerprints`, which re-checks it at load time.
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-php = "0.24.1"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-groovy = "0.1.2"
tree-sitter-scala = "0.26.2"
# Matches the Python side exactly (tree-sitter-swift 0.7.3, ABI 15, 563 kinds,
# 46 fields) -- the crate and the PyPI package are cut from the same grammar
# release, which the load-time fingerprint check then verifies rather than
# trusts.
tree-sitter-swift = "0.7.3"
# Bespoke walker (no LanguageConfig). Crate and PyPI package are both 1.1.2.
tree-sitter-zig = "1.1.2"
# Bespoke walker. Crate and PyPI package are both 0.3.5.
tree-sitter-elixir = "0.3.5"
# Bespoke walker, TWO grammars (LANGUAGE_OCAML / LANGUAGE_OCAML_INTERFACE).
# Crate and PyPI package are both 0.25.0.
tree-sitter-ocaml = "0.25.0"
# Bespoke walker. Crate and PyPI package are both 0.23.1.
tree-sitter-julia = "0.23.1"
# Bespoke walker. Crate and PyPI package are both 0.6.0.
tree-sitter-fortran = "0.6.0"
# Bespoke walker. Crate and PyPI package are both 3.0.2.
tree-sitter-objc = "3.0.2"
# `_csharp_namespace_id` is `sha1(dotted_name).hexdigest()[:16]`, so the digest
# is part of the node id and has to be the real thing.
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
